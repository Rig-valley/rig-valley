<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A cozy pixel-art farming game where the crops are mining rigs. Build rigs, keep them cool and harvest NVDA Stock Token rewards on Robinhood Chain."
    />
    <meta name="theme-color" content="#0b0a1a" />
    <link rel="canonical" href="https://rigvalley.com/" />
    <!-- Link previews (Telegram, WhatsApp, Discord, X…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rig Valley" />
    <meta property="og:url" content="https://rigvalley.com/" />
    <meta property="og:title" content="Rig Valley — Grow rigs. Harvest rewards. Pet no cats." />
    <meta
      property="og:description"
      content="A cozy pixel-art farming game where the crops are mining rigs. Build rigs, keep them cool and harvest NVDA Stock Token rewards on Robinhood Chain."
    />
    <meta property="og:image" content="https://rigvalley.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Rig Valley title screen: a neon-lit garage and a field of mining rigs at night."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rig Valley — Grow rigs. Harvest rewards. Pet no cats." />
    <meta
      name="twitter:description"
      content="A cozy pixel-art farming game where the crops are mining rigs. Build rigs, keep them cool and harvest NVDA Stock Token rewards on Robinhood Chain."
    />
    <meta name="twitter:image" content="https://rigvalley.com/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="Rig Valley title screen: a neon-lit garage and a field of mining rigs at night."
    />
    <title>Rig Valley</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      /* Shown until the game has booted, so a slow first load never looks broken. */
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #0b0a1a;
        color: #cdd2ef;
        font:
          700 16px/1 ui-monospace,
          Consolas,
          monospace;
        letter-spacing: 0.2em;
      }
      #boot-loader b {
        font-size: 28px;
        color: #ff52dc;
        text-shadow: 3px 3px 0 #2a2b63;
      }
      #boot-loader b span {
        color: #3ff2ff;
      }
      #boot-loader .bar {
        width: 180px;
        height: 10px;
        border: 2px solid #3d438a;
        background: repeating-linear-gradient(90deg, #3ff2ff 0 8px, transparent 8px 12px) 0 0 / 36px
          100% repeat-y;
        animation: boot-bar 0.8s steps(6) infinite;
      }
      @keyframes boot-bar {
        to {
          background-position: 36px 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="game" aria-label="Rig Valley game world"></div>
      <div id="ui-frame"><div id="ui"></div></div>
    </div>
    <div id="boot-loader" role="status" aria-live="polite">
      <b>RIG <span>VALLEY</span></b>
      <div class="bar"></div>
      <div>LOADING…</div>
    </div>
    <div class="unsupported" role="alert">
      Rig Valley is made for desktop browsers. Please open it on a computer with a bigger window.
    </div>
    <noscript>Rig Valley needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
