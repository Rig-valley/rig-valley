# Local PostgreSQL for Rig Valley. Then set in .env:
#   DATABASE_URL=postgres://rigvalley:rigvalley@localhost:5432/rigvalley
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rigvalley
      POSTGRES_PASSWORD: rigvalley
      POSTGRES_DB: rigvalley
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
